[build-system]
requires = ["setuptools>=77"]  # SPDX `license` and `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "strudelizer"
dynamic = ["version"]  # from strudelizer.__version__, the one place it is set
description = "Convert MIDI, chord sheets, tabs, Guitar Pro and MusicXML into Strudel (strudel.cc) live-coding patterns"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pierre-codes" }]
keywords = ["strudel", "live coding", "midi", "chord sheet", "chordpro", "guitar tab", "guitar pro", "musicxml", "tidal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
guitarpro = ["PyGuitarPro>=0.9"]
musicxml = ["music21>=9"]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "pyflakes>=3", "httpx>=0.27", "build>=1.2"]
all = ["strudelizer[guitarpro,musicxml,ui,dev]"]

[project.scripts]
strudelize = "strudelizer.cli:main"

[project.entry-points."strudelizer.importers"]
midi = "strudelizer.importers.midi:MidiImporter"
chordsheet = "strudelizer.importers.chordsheet:ChordSheetImporter"
ascii_tab = "strudelizer.importers.ascii_tab:AsciiTabImporter"
guitarpro = "strudelizer.importers.guitarpro:GuitarProImporter [guitarpro]"
musicxml = "strudelizer.importers.musicxml:MusicXmlImporter [musicxml]"

[project.entry-points."strudelizer.passes"]
quantize = "strudelizer.passes.quantize:Quantize"
dedupe_bars = "strudelizer.passes.dedupe_bars:DedupeBars"
arrange = "strudelizer.passes.arrange:Arrange"
detect_sections = "strudelizer.passes.sections:DetectSections"
transpose = "strudelizer.passes.transpose:Transpose"
remap_drums = "strudelizer.passes.remap_drums:RemapDrums"

[project.entry-points."strudelizer.emitters"]
strudel = "strudelizer.emitters.strudel:StrudelEmitter"
ir_json = "strudelizer.emitters.ir_json:IrJsonEmitter"
midi = "strudelizer.emitters.midi:MidiEmitter"

[project.entry-points."strudelizer.profiles"]
default = "strudelizer.profiles:default"
lofi = "strudelizer.profiles:lofi"
techno = "strudelizer.profiles:techno"

[project.entry-points."strudelizer.styles"]
lofi = "strudelizer.styles:lofi"
rock = "strudelizer.styles:rock"
four_on_floor = "strudelizer.styles:four_on_floor"

[tool.setuptools.dynamic]
version = { attr = "strudelizer.__version__" }

[tool.setuptools.packages.find]
include = ["strudelizer*", "strudelizer_ui*"]

[tool.setuptools.package-data]
"strudelizer.core" = ["schema.json"]
"strudelizer.profiles" = ["*.yaml"]
"strudelizer.styles" = ["*.yaml"]
"strudelizer_ui" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
