# Runs the same checks as `python scripts/check.py` locally: lint (pyflakes
# and the Python 3.10 grammar), the test suite in strict mode with every
# optional extra installed (including the plugin-install gate), the Strudel
# check of every golden .js against the pinned runtime, and a package build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]  # oldest supported (requires-python) and newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Strudel's runtime for the validity check; check.py runs `npm ci`
      # in tests/strudel against the committed lockfile (@strudel/* 1.2.6).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/strudel/package-lock.json

      - name: Install Strudelizer with every extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Lint, tests, Strudel check, package build
        run: python scripts/check.py
